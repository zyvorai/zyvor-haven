{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haven-controller
  labels:
    app.kubernetes.io/name: haven
rules:
  - apiGroups: [identity.haven.dev]
    resources: [identityplanes, identityplanes/status, realmbundles, realmbundles/status, oidcclients, oidcclients/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, scheduledbackups, backups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [k8s.keycloak.org]
    resources: [keycloaks, keycloakrealmimports]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets, configmaps, services, namespaces]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haven-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: haven
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haven-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: haven
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haven-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haven-controller
  labels:
    app.kubernetes.io/name: haven
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haven-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
