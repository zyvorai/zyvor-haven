{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haven.name" . }}-controller
  labels:
    {{- include "haven.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "haven.name" . }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "haven.name" . }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
          env:
            # Default haven-idp image for planes the controller manages (spec.idp.image overrides).
            - name: HAVEN_IDP_IMAGE
              value: "{{ .Values.idp.image.repository }}:{{ .Values.idp.image.tag }}"
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
{{- end }}
---
{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "haven.name" . }}-console
  labels:
    {{- include "haven.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "haven.name" . }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "haven.name" . }}
        app.kubernetes.io/component: console
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HAVEN_DATA_DIR
              value: /var/lib/haven
            - name: HAVEN_CLIENT_SECRET_ROTATION_DAYS
              value: {{ .Values.console.clientSecretRotationDays | quote }}
            {{- if eq .Values.identity.backend "native" }}
            - name: HAVEN_IDP_BACKEND
              value: native
            - name: HAVEN_IDP_URL
              value: {{ default (printf "http://%s-idp.%s.svc:8081" .Values.plane.name .Values.plane.namespace) .Values.identity.url | quote }}
            - name: HAVEN_IDP_ADMIN_REALM
              value: {{ .Values.identity.adminRealm | quote }}
            - name: HAVEN_IDP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-idp" .Values.plane.name) .Values.identity.adminClientSecretRef.name }}
                  key: {{ .Values.identity.adminClientSecretRef.key }}
            {{- else }}
            # DEPRECATED: Keycloak backend, kept for migration (docs/migrate-from-keycloak.md).
            - name: KEYCLOAK_URL
              value: {{ default (printf "http://%s-service.%s.svc:8080" .Values.plane.name .Values.plane.namespace) .Values.identity.url | quote }}
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.name }}-initial-admin
                  key: username
                  optional: true
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.plane.name }}-initial-admin
                  key: password
                  optional: true
            {{- end }}
          volumeMounts:
            - name: haven-data
              mountPath: /var/lib/haven
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: haven-data
          {{- if .Values.console.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "haven.name" . }}-console-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
