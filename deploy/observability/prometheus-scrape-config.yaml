# Plain Prometheus scrape_configs snippet (no operator). Merge into prometheus.yml.
# The alert rules use job="haven-idp"; keep that job_name.
scrape_configs:
  - job_name: haven-idp
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["haven-idp.haven.svc:9102"] # HAVEN_IDP_METRICS_LISTEN=:9102
