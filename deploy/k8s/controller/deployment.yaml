apiVersion: v1
kind: Namespace
metadata:
  name: haven-system
  labels:
    app.kubernetes.io/part-of: haven
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haven-controller
  namespace: haven-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haven-controller
rules:
  - apiGroups: [identity.haven.dev]
    resources: [identityplanes, identityplanes/status, identityplanes/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  # OIDCClient: the controller registers clients and writes their Secrets; finalizers is
  # needed for the blockOwnerDeletion owner reference on the generated Secret.
  - apiGroups: [identity.haven.dev]
    resources: [oidcclients, oidcclients/status, oidcclients/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, backups, scheduledbackups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [k8s.keycloak.org]
    resources: [keycloaks]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch]
  # Secrets (plane and OIDCClient credentials) are never deleted by the controller: no delete
  # (OIDCClient Secrets are garbage-collected through their owner reference).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch]
  # haven-idp workload objects (<plane>-idp), see internal/render/IDP_CONTRACT.md.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # Event recorder (OIDCClient sync results; messages never contain secrets).
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haven-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haven-controller
subjects:
  - kind: ServiceAccount
    name: haven-controller
    namespace: haven-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haven-controller-leader
  namespace: haven-system
rules:
  - apiGroups: [""]
    resources: [configmaps, leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haven-controller-leader
  namespace: haven-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haven-controller-leader
subjects:
  - kind: ServiceAccount
    name: haven-controller
    namespace: haven-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haven-controller
  namespace: haven-system
  labels:
    app: haven-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haven-controller
  template:
    metadata:
      labels:
        app: haven-controller
    spec:
      serviceAccountName: haven-controller
      # Pod Security "restricted" compliant (checked against a real API server
      # in a namespace enforcing that level).
      securityContext:
        runAsNonRoot: true
        # Numeric: the kubelet cannot verify runAsNonRoot against an image whose USER
        # is a name ("nonroot"), and refuses to start the container.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: haven-controller:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
          ports:
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
