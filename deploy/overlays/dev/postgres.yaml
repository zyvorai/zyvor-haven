# CloudNativePG cluster for the identity plane (compose path).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: identity
  labels:
    haven.identity/plane: platform
    app.kubernetes.io/component: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: haven_idp
      owner: haven_idp
      secret:
        name: platform-db-app
  storage:
    size: 8Gi
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
---
# Dev-only static password (matches platform-idp-db in idp.yaml). Prod overlay does not commit a reusable password.
apiVersion: v1
kind: Secret
metadata:
  name: platform-db-app
  namespace: identity
  annotations:
    haven.identity/dev-placeholder: "true"
  labels:
    cnpg.io/reload: "true"
    haven.identity/plane: platform
type: kubernetes.io/basic-auth
stringData:
  username: haven_idp
  password: CHANGE_ME_DEV_ONLY
