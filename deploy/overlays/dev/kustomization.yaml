apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - namespace.yaml
  - postgres.yaml
  # keycloak.yaml is DEPRECATED and no longer deployed (see its header); haven-idp replaces it.
  - idp.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: haven
      haven.identity/plane: platform
      haven.identity/profile: dev
