apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: identity
resources:
  - namespace.yaml
  - postgres.yaml
  # keycloak.yaml is DEPRECATED and no longer deployed; haven-idp replaces it.
  - idp.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: haven
      haven.identity/plane: platform
      haven.identity/profile: production
