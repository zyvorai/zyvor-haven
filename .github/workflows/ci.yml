name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Embed placeholder UI
        # haven-console embeds ui/web's build output (gitignored); the UI job builds the real one.
        run: mkdir -p cmd/haven-console/dist && echo '<!doctype html>' > cmd/haven-console/dist/index.html

      - name: Format
        run: test -z "$(gofmt -l api cmd internal)" || { gofmt -l api cmd internal; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          # A fresh checkout would delete the placeholder UI that go:embed needs.
          repo-checkout: false

      - name: Security scan (gosec)
        # The gosec action's container lags the go.mod toolchain; build it with setup-go's Go instead.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 ./...

      - name: Test
        run: go test -race ./...

      - name: Build haven-idp (static, both image arches)
        # Mirrors Dockerfile.idp; catches cgo or platform-specific breakage without a docker build.
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/haven-idp
          done

      - name: Cross-build haven-idp and haven for macOS (CGO off)
        run: |
          for arch in amd64 arm64; do
            for cmd in haven-idp haven; do
              GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/$cmd
            done
          done

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "Test (macOS: launchd plist, Keychain wrapper, paths, CLI)"
        run: go test -race -count=1 ./cmd/haven ./cmd/haven-idp ./internal/havencli ./internal/keychain ./internal/idp/store/memstore

      - name: Build both architectures
        run: make build-darwin

      - name: Build the (unsigned) installer package
        run: make macos-pkg VERSION=0.0.0-ci

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
