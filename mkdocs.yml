site_name: Haven
site_description: Identity for the private cloud — your own OpenID Connect identity server with HA PostgreSQL, run as one product on Kubernetes.
site_url: https://zyvorai.github.io/zyvor-haven/
repo_url: https://github.com/zyvorai/zyvor-haven
repo_name: zyvorai/haven
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/readme/zyvor-logo.svg
  favicon: assets/readme/zyvor-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

hooks:
  - docs/overrides/hooks.py
extra_css:
  - stylesheets/apple-glass.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Why Haven: why-haven.md
  - What you get: what-you-get.md
  - Quick start: quick-start.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Getting started: getting-started.md
  - Operations:
      - Runbook: runbook.md
      - Lab host: lab-host.md
      - Console: console.md
      - Security posture: security-posture.md
      - Policy as code: policy-as-code.md
      - Access review: access-review.md
      - Tutorials: tutorials.md
      - CLI: cli.md
      - Production overlay: production-overlay.md
      - Install with Helm: install-helm.md
      - Deploy haven-idp (native): deploy-native.md
      - OIDCClient CRD: oidcclient-crd.md
      - Ingress registration: ingress-registration.md
      - Email and password reset: email-and-password-reset.md
      - Federation (Sign in with Google, Entra, OIDC): federation.md
      - SSO sessions and single logout: sso-and-logout.md
      - Guard as an admission gate: guard-gate.md
      - Time-boxed access (JIT roles): time-boxed-access.md
      - Dynamic client registration: dynamic-client-registration.md
      - Two-step verification (TOTP): mfa-totp.md
      - Passkeys (WebAuthn): passkeys.md
      - Login fallback and step-up: login-fallback-and-stepup.md
      - DPoP (sender-constrained tokens): dpop.md
      - FAPI building blocks (PAR, JAR, RAR): fapi-par-jar-rar.md
      - Password policy: password-policy.md
      - Device login (CLI, CI): device-flow.md
      - Workload identity (no static secrets): workload-identity.md
      - Agent and MCP identities: agent-identities.md
      - MCP resource indicators and discovery: mcp-resource-indicators.md
      - SCIM provisioning: scim.md
      - CIBA (approve an agent out of band): ciba.md
      - Shared signals (SSF, CAEP, RISC): shared-signals.md
      - MCP clients and consent: mcp-clients-and-consent.md
      - Account console (self-service): account-console.md
      - Keep dev data across restarts: dev-persist.md
      - Time Machine undo (native): time-machine-undo.md
      - Add an app (wizard and Test login): add-an-app.md
      - Backups: backups.md
      - haven CLI (device login, kubectl): haven-cli.md
      - macOS (launchd service, Keychain, packaging): macos.md
  - Migration:
      - Migrate from Keycloak: migrate-from-keycloak.md
      - Import a Keycloak realm: import-from-keycloak.md
  - Design:
      - Architecture: architecture.md
      - UX: ux.md
      - Private cloud: private-cloud.md
      - Roadmap: roadmap.md
      - Research: RESEARCH.md
  - Meta:
      - Documentation map: documentation-map.md
      - Contributing: contributing.md
      - License headers: LICENSE_HEADERS.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zyvorai/zyvor-haven
